<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7dfcb">
  <title>奴役的账本 — 被掠夺的生命，被继承的财富</title>
  <meta name="description" content="以中文呈现跨大西洋奴隶贸易、废奴历程与财富遗产，附 SlaveVoyages 年度估计及档案资料。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ctext%20x%3D%2232%22%20y%3D%2252%22%20text-anchor%3D%22middle%22%20font-family%3D%22Apple%20Color%20Emoji%2CSegoe%20UI%20Emoji%2CNoto%20Color%20Emoji%2Csans-serif%22%20font-size%3D%2252%22%3E%F0%9F%91%B6%F0%9F%8F%BF%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="./style.css?v=zoom-clean-20261127">
  <script src="./fonts/font-data.js?v=zoom-clean-20261127" defer></script>
  <script src="./data.js?v=zoom-clean-20261127" defer></script>
  <script src="./app.js?v=zoom-clean-20261127" defer></script>
</head>
<body>
  <header class="toolbar">
    <a class="identity" href="./" aria-label="The Ledger 首页"><span class="identity-mark" role="img" aria-label="深肤色宝宝">👶🏿</span><span>THE LEDGER</span></a>
    <nav aria-label="海报工具">
      <button id="fit-button" type="button" aria-pressed="true">整页预览</button><button id="width-button" type="button" aria-pressed="false">适应宽度</button>
      <span class="toolbar-divider"></span>
      <button id="edit-button" type="button"><span class="tool-icon">✎</span>替换内容</button>
      <button id="export-button" class="export-button" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3-3 3 3 3-3M3 11v3h10v-3"/></svg>导出 SVG</button>
    </nav>
  </header>
  <main>
    <div id="poster-stage" class="poster-stage"><div id="poster" class="poster" aria-label="历史账本信息艺术图表"></div></div>
    <details id="research-notes" class="research-notes">
      <summary><span>资料来源与统计口径</span></summary>
      <div id="sources-content"></div>
    </details>
  </main>
  <div class="zoom-controls" role="group" aria-label="画面缩放"><button id="zoom-out" type="button" aria-label="缩小">−</button><button id="zoom-reset" type="button" aria-label="还原到百分之百" title="还原到100%"><output id="zoom-value" aria-live="polite">100%</output></button><button id="zoom-in" type="button" aria-label="放大">＋</button></div>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="editor-backdrop" class="editor-backdrop" hidden></div>
  <aside id="editor" class="editor" aria-labelledby="editor-title" aria-modal="true" role="dialog" hidden>
    <div class="editor-header"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="editor-title">写入你的账本</h2></div><button id="close-editor" class="close-button" aria-label="关闭编辑器">×</button></div>
    <p class="editor-intro">版式保留，让内容成为你自己的。修改会保存在当前浏览器中。</p>
    <form id="content-form">
      <label>主标题<input name="title" maxlength="8" required></label>
      <label>副标题<input name="subtitle" maxlength="16" required></label>
      <label>引题<input name="deck" maxlength="50" required></label>
      <label>导读文字<textarea name="intro" rows="7" required></textarea></label>
      <label>右侧留白中的注释<textarea name="quote" rows="3" required></textarea></label>
      <details><summary>时间地层、图表与资料</summary><p class="data-help">sectors 的 value 为1835年补偿初始配额的整英镑部分；flows 对应分配项目，圆面积编码金额；area 为年度登船与抵岸估计。请同步保留来源。</p><label for="data-editor" class="sr-only">图表 JSON 数据</label><textarea id="data-editor" class="code-input" rows="18" spellcheck="false"></textarea></details>
      <p id="editor-error" class="editor-error" role="alert"></p>
      <div class="editor-actions"><button type="button" id="reset-button">恢复考证稿</button><button type="submit" class="primary-button">应用修改</button></div>
    </form>
    <p class="editor-note">源文件中的 <code>data.js</code> 也可直接编辑。所有文字和图形均为真实代码绘制。</p>
  </aside>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
